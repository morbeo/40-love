site_name: 40 love devlog
site_description: Building a minimalist arcade tennis game in Godot 4, one step at a time.
site_url: https://morbeo.github.io/40-love/
repo_url: https://github.com/morbeo/40-love
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: light green
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Devlog:
      - "#0 Setting up the workshop": devlog/000-setup.md
      - "#1 The court and its coordinates": devlog/001-court.md
      - "#2 The ball: flight, bounce and net": devlog/002-ball.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

