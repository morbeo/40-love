# git-cliff: builds docs/changelog.md from Conventional Commit messages.
[changelog]
header = """
# Changelog

Generated from commit messages on every deploy. Newest first.\n
"""
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Devlog and docs" },
  { message = "^test", group = "<!-- 4 -->Tests" },
  { message = "^(refactor|build|ci|chore)", group = "<!-- 5 -->Maintenance" },
]
sort_commits = "newest"
